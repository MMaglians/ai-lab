[project]
name = "ai-lab"
version = "0.1.0"
description = "Personal lab for learning LLMs, APIs, RAG and AI agents, with measured experiments"
readme = "README.md"
authors = [
    { name = "Matteo Magliano", email = "matteomagliano02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi[standard]>=0.143.1",
    "google-genai>=2.3.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
ai-lab = "ai_lab:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
